<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BullTronic | Em Construção</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #0ea5e9;
            --text-color: #c9d1d9;
            --heading-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            padding: 3rem 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 2rem;
            color: var(--heading-color);
            margin-bottom: 1rem;
        }

        h1 span {
            color: var(--accent-color);
        }

        p {
            font-size: 1.1rem;
            color: #8b949e;
            margin-bottom: 2rem;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid #30363d;
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1> ... </h1>
        <p>Em breve!</p>
        <div class="loader"></div>
        <footer>&copy; 2026 BullTronic. Todos os direitos reservados.</footer>
    </div>

</body>
</html>
