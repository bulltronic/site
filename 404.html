<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Não Encontrada - BullTronic</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 100px 20px;
      margin: 0;
    }
    h1 {
      font-size: 72px;
      margin-bottom: 10px;
      color: #38bdf8;
    }
    p {
      font-size: 18px;
      color: #94a3b8;
      margin-bottom: 30px;
    }
    a {
      display: inline-block;
      background-color: #38bdf8;
      color: #0f172a;
      padding: 12px 24px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: background-color 0.2s;
    }
    a:hover {
      background-color: #0ea5e9;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Oops! A página que procura não existe ou foi movida.</p>
  <a href="/">Voltar à Página Principal</a>
</body>
</html>
